name: ots

# OpenTimestamps leg of the UST anchor chain.
# - on push of a new anchor: stamp it (calendar servers, free, no accounts)
# - daily: upgrade pending proofs once calendars anchor into Bitcoin
# Proof path: slot hash -> merkle path -> root (anchor json) -> git commit
#             -> .ots -> Bitcoin block. No trust in the operator required.

on:
  push:
    paths:
      - "anchors/**/*.json"
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ots
  cancel-in-progress: false

jobs:
  ots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: pip install --quiet opentimestamps-client

      - name: stamp new anchors
        run: |
          shopt -s globstar nullglob
          # ONE call per batch, not one per file. `ots stamp a b c` builds a single Merkle tree over all the
          # arguments and submits ONE commitment per calendar — measured 2026-08-06: three files, three
          # submissions total (one per calendar), and both proofs carry the identical calendar commitment.
          #
          # The per-file loop this replaces is why the workflow was switched off: a gap of N hours turned into
          # N requests against free public calendars in a single run. At the backlog measured on 2026-08-06 that
          # was 1004 requests. Batched, the same backlog is four.
          #
          # Chunked rather than one giant argv: bounds memory and keeps a partial failure to one chunk.
          missing=()
          for f in anchors/**/*.json; do
            [ -f "$f.ots" ] || missing+=("$f")
          done
          echo "anchors missing a stamp: ${#missing[@]}"
          if [ ${#missing[@]} -gt 0 ]; then
            for ((i=0; i<${#missing[@]}; i+=250)); do
              chunk=("${missing[@]:i:250}")
              echo "stamping ${#chunk[@]} anchor(s) in one call"
              ots stamp "${chunk[@]}"
            done
          fi

      # THE STAMP ABOVE ATTESTS THE FILE. The registered `bitcoin-ots` substrate requires the proof to attest
      # the ROOT — the connector checks `ots.timestamp.msg == bytes.fromhex(merkle_root)` — so every proof this
      # repository held before 2026-08-06 is real, Bitcoin-backed, and rejected by a verifier as "not mine".
      # Measured that day: 1033 stamps, 1031 with a Bitcoin attestation, ZERO hours conformant.
      #
      # `ots stamp` cannot do this: it takes files and always hashes their bytes, and no file can hash to a
      # chosen root. So the digest is stamped through the library, keeping the batching that made the backlog
      # affordable — one Merkle tree per chunk, one submission per calendar.
      #
      # The file-stamp above is KEPT. It is not wrong, it simply proves something else (the file existed), and
      # the historical set is not rewritten — owner's decision 2026-08-06: the past is fixed forward.
      - name: stamp anchor ROOTS (the conformant proof)
        run: python3 tools/stamp-roots.py

      - name: upgrade pending proofs
        run: |
          shopt -s globstar nullglob
          # The same unbounded loop the stamp step had, one step over — and it is what this run met on
          # 2026-08-06: 1026 proofs, 1004 of them created minutes earlier, every one asked the calendars a
          # question guaranteed to be answered "not yet".
          #
          # Two bounds. `ots info` is LOCAL — measured 0.24s, no network — so a proof that already carries a
          # Bitcoin attestation costs a file read and is skipped. And the remaining attempts are CAPPED: a
          # calendar commits within hours, so a pending proof missed today is picked up by tomorrow's run, and
          # the backlog drains itself without any run ever making a thousand requests.
          # 256, not a round decimal: the cap exists to bound a loop, and a power of two says it was chosen
          # as a bound rather than picked because it looked reasonable.
          UPGRADE_CAP=256
          pending=(); final=0
          # BOTH kinds: `*.json.ots` attests the file, `*.root.ots` attests the root. A glob naming only the
          # first would leave every conformant proof pending forever — the new kind would be created and never
          # upgraded, which looks identical to a calendar that never commits.
          for f in anchors/**/*.ots; do
            if ots info "$f" 2>/dev/null | grep -q 'BitcoinBlockHeaderAttestation'; then
              final=$((final+1))
            else
              pending+=("$f")
            fi
          done
          echo "proofs: $((final + ${#pending[@]})) total · $final anchored in Bitcoin · ${#pending[@]} pending"
          n=0
          for f in "${pending[@]}"; do
            [ "$n" -ge "$UPGRADE_CAP" ] && break
            ots upgrade "$f" || true
            n=$((n+1))
          done
          echo "upgrade attempts this run: $n (cap $UPGRADE_CAP)"
          if [ ${#pending[@]} -gt "$UPGRADE_CAP" ]; then
            echo "$(( ${#pending[@]} - UPGRADE_CAP )) pending proof(s) deferred to the next run — a bounded loop is the point, not an omission"
          fi
          find anchors -name "*.bak" -delete

      # THIS LEG LOSES A RACE IT CANNOT WIN BY BEING FASTER, so it is written to survive losing.
      #
      # Measured 2026-08-10: every scheduled run since 2026-08-08 failed here — 8 of 8, then 24 of 25, then 7 of 7
      # — with `! [rejected] main -> main (fetch first)`. Not one `.json.ots` reached the repository on 09-08 or
      # 10-08, while `.root.ots` kept arriving: the root is written by the publisher's worker, the per-slot proofs
      # only by this job. A leg that fails every hour is a leg that is off, and the assertion below cannot say so
      # because it never runs.
      #
      # The race is structural, not incidental. This workflow triggers on `anchors/**/*.json`, so the worker's
      # hourly anchor commit STARTS this run; the worker then commits `NN.root.ots` seconds later and moves the
      # ref out from under it. Two independent writers, one branch, guaranteed to meet.
      #
      # WHY REBASE-AND-RETRY IS THE FIX AND NOT A BAND-AID. The writers touch DISJOINT paths — the worker adds
      # `NN.json` and `NN.root.ots`, this job adds `NN.json.ots`. There is no content conflict to resolve, only a
      # ref that advanced, so a rebase is always clean and the operations commute. Retrying a genuinely conflicting
      # write would be papering over a design fault; retrying an append to a different file is the ordinary
      # protocol for concurrent appenders to one ref.
      #
      # It fails LOUDLY when the retries run out: a push that silently gives up would recreate exactly the
      # six-week silence recorded below.
      - name: commit proofs
        run: |
          git config user.name "ots-bot"
          git config user.email "contact@noosphere.md"
          git add -A anchors
          if git diff --cached --quiet; then echo "nothing to stamp this run"; exit 0; fi
          git commit -m "ots: stamp/upgrade proofs"
          for attempt in 1 2 3 4 5; do
            if git push; then echo "pushed on attempt $attempt"; exit 0; fi
            echo "push rejected — another writer advanced main; rebasing (attempt $attempt/5)"
            git pull --rebase --no-edit || { echo "REBASE FAILED — the writers are no longer touching disjoint paths, which is a design change, not a race"; exit 1; }
            sleep $(( attempt * 3 ))
          done
          echo "five pushes lost the race in a row — this is no longer contention, something is pushing continuously"
          exit 1

      # A stamping leg that only speaks when it fails is indistinguishable from one that is switched off — which
      # is exactly what happened here: disabled on 2026-06-12 during construction, and nothing anywhere said so
      # for six weeks while 1004 hours went unstamped. An anchor stamped late still bounds its content from
      # above, but it can never prove the hour was timely; that property is lost the moment it is missed.
      #
      # So this step ASSERTS freshness and prints a positive line every run. Red here is a real signal: GitHub
      # emails a failed scheduled run, and the badge stops being green.
      - name: assert the newest anchors are stamped
        run: |
          shopt -s globstar nullglob
          total=0; stamped=0; stale=0
          # 3 hours of slack: an anchor lands at HH:02 and the push-triggered run needs a moment; the daily
          # schedule must not fail over the hour that is merely in flight.
          cutoff=$(( $(date -u +%s) - 3*3600 ))
          for f in anchors/**/*.json; do
            total=$((total+1))
            if [ -f "$f.ots" ]; then stamped=$((stamped+1)); continue; fi
            # anchors/YYYY/MM/DD/HH.json -> epoch
            when=$(echo "$f" | sed -E 's#anchors/([0-9]{4})/([0-9]{2})/([0-9]{2})/([0-9]{2})\.json#\1-\2-\3 \4:00:00#')
            ts=$(date -u -d "$when" +%s 2>/dev/null || echo 0)
            # A path this gate cannot read is NOT a pass. Skipping it would make the check fail OPEN, and an
            # unreadable name is exactly how a file leaves a roster unnoticed.
            if [ "$ts" -eq 0 ]; then
              echo "::error::cannot derive an hour from $f — this gate cannot judge it, and silence would read as clean"
              exit 1
            fi
            if [ "$ts" -lt "$cutoff" ]; then
              stale=$((stale+1))
              [ "$stale" -le 5 ] && echo "STALE: $f has no .ots"
            fi
          done
          echo "ots freshness: $stamped/$total anchors stamped · $stale older than 3h and unstamped"
          if [ "$stale" -gt 0 ]; then
            echo "::error::$stale anchor(s) older than 3h carry no OpenTimestamps proof — the chain to Bitcoin is broken for those hours, and a late stamp can never restore their timeliness"
            exit 1
          fi
          echo "OK — every anchor older than 3h carries a stamp"

      # AND THE SAME ASSERTION FOR THE CONFORMANT KIND, from the boundary forward.
      #
      # Without it the root-stamping step could stop producing anything and every signal above would stay
      # green: file-stamps keep appearing, the count keeps rising, the badge stays clean. That is precisely the
      # shape that hid six weeks of no stamping at all — a leg whose silence is indistinguishable from health.
      #
      # It lives in the stamper rather than in shell so the boundary and the `.root.ots` naming are written
      # ONCE, and because the first attempt at writing it here measured nothing: `globstar` is bash 4+ and
      # `date -d` is GNU, so on the author's machine the loop iterated zero files and printed a green verdict.
      # Exercised in three directions before shipping — red on a missing stamp, green when present, and red on
      # an EMPTY roster, since zero examined is never a pass.
      - name: assert the conformant root proofs are fresh
        run: python3 tools/stamp-roots.py --check
