name: ots

# OpenTimestamps leg of the UST anchor chain.
# - on push of a new anchor: stamp it (calendar servers, free, no accounts)
# - daily: upgrade pending proofs once calendars anchor into Bitcoin
# Proof path: slot hash -> merkle path -> root (anchor json) -> git commit
#             -> .ots -> Bitcoin block. No trust in the operator required.

on:
  push:
    paths:
      - "anchors/**/*.json"
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ots
  cancel-in-progress: false

jobs:
  ots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: pip install --quiet opentimestamps-client

      - name: stamp new anchors
        run: |
          shopt -s globstar nullglob
          # ONE call per batch, not one per file. `ots stamp a b c` builds a single Merkle tree over all the
          # arguments and submits ONE commitment per calendar — measured 2026-08-06: three files, three
          # submissions total (one per calendar), and both proofs carry the identical calendar commitment.
          #
          # The per-file loop this replaces is why the workflow was switched off: a gap of N hours turned into
          # N requests against free public calendars in a single run. At the backlog measured on 2026-08-06 that
          # was 1004 requests. Batched, the same backlog is four.
          #
          # Chunked rather than one giant argv: bounds memory and keeps a partial failure to one chunk.
          missing=()
          for f in anchors/**/*.json; do
            [ -f "$f.ots" ] || missing+=("$f")
          done
          echo "anchors missing a stamp: ${#missing[@]}"
          if [ ${#missing[@]} -gt 0 ]; then
            for ((i=0; i<${#missing[@]}; i+=250)); do
              chunk=("${missing[@]:i:250}")
              echo "stamping ${#chunk[@]} anchor(s) in one call"
              ots stamp "${chunk[@]}"
            done
          fi

      - name: upgrade pending proofs
        run: |
          shopt -s globstar nullglob
          # The same unbounded loop the stamp step had, one step over — and it is what this run met on
          # 2026-08-06: 1026 proofs, 1004 of them created minutes earlier, every one asked the calendars a
          # question guaranteed to be answered "not yet".
          #
          # Two bounds. `ots info` is LOCAL — measured 0.24s, no network — so a proof that already carries a
          # Bitcoin attestation costs a file read and is skipped. And the remaining attempts are CAPPED: a
          # calendar commits within hours, so a pending proof missed today is picked up by tomorrow's run, and
          # the backlog drains itself without any run ever making a thousand requests.
          # 256, not a round decimal: the cap exists to bound a loop, and a power of two says it was chosen
          # as a bound rather than picked because it looked reasonable.
          UPGRADE_CAP=256
          pending=(); final=0
          for f in anchors/**/*.json.ots; do
            if ots info "$f" 2>/dev/null | grep -q 'BitcoinBlockHeaderAttestation'; then
              final=$((final+1))
            else
              pending+=("$f")
            fi
          done
          echo "proofs: $((final + ${#pending[@]})) total · $final anchored in Bitcoin · ${#pending[@]} pending"
          n=0
          for f in "${pending[@]}"; do
            [ "$n" -ge "$UPGRADE_CAP" ] && break
            ots upgrade "$f" || true
            n=$((n+1))
          done
          echo "upgrade attempts this run: $n (cap $UPGRADE_CAP)"
          if [ ${#pending[@]} -gt "$UPGRADE_CAP" ]; then
            echo "$(( ${#pending[@]} - UPGRADE_CAP )) pending proof(s) deferred to the next run — a bounded loop is the point, not an omission"
          fi
          find anchors -name "*.bak" -delete

      - name: commit proofs
        run: |
          git config user.name "ots-bot"
          git config user.email "contact@noosphere.md"
          git add -A anchors
          git diff --cached --quiet || { git commit -m "ots: stamp/upgrade proofs"; git push; }

      # A stamping leg that only speaks when it fails is indistinguishable from one that is switched off — which
      # is exactly what happened here: disabled on 2026-06-12 during construction, and nothing anywhere said so
      # for six weeks while 1004 hours went unstamped. An anchor stamped late still bounds its content from
      # above, but it can never prove the hour was timely; that property is lost the moment it is missed.
      #
      # So this step ASSERTS freshness and prints a positive line every run. Red here is a real signal: GitHub
      # emails a failed scheduled run, and the badge stops being green.
      - name: assert the newest anchors are stamped
        run: |
          shopt -s globstar nullglob
          total=0; stamped=0; stale=0
          # 3 hours of slack: an anchor lands at HH:02 and the push-triggered run needs a moment; the daily
          # schedule must not fail over the hour that is merely in flight.
          cutoff=$(( $(date -u +%s) - 3*3600 ))
          for f in anchors/**/*.json; do
            total=$((total+1))
            if [ -f "$f.ots" ]; then stamped=$((stamped+1)); continue; fi
            # anchors/YYYY/MM/DD/HH.json -> epoch
            when=$(echo "$f" | sed -E 's#anchors/([0-9]{4})/([0-9]{2})/([0-9]{2})/([0-9]{2})\.json#\1-\2-\3 \4:00:00#')
            ts=$(date -u -d "$when" +%s 2>/dev/null || echo 0)
            # A path this gate cannot read is NOT a pass. Skipping it would make the check fail OPEN, and an
            # unreadable name is exactly how a file leaves a roster unnoticed.
            if [ "$ts" -eq 0 ]; then
              echo "::error::cannot derive an hour from $f — this gate cannot judge it, and silence would read as clean"
              exit 1
            fi
            if [ "$ts" -lt "$cutoff" ]; then
              stale=$((stale+1))
              [ "$stale" -le 5 ] && echo "STALE: $f has no .ots"
            fi
          done
          echo "ots freshness: $stamped/$total anchors stamped · $stale older than 3h and unstamped"
          if [ "$stale" -gt 0 ]; then
            echo "::error::$stale anchor(s) older than 3h carry no OpenTimestamps proof — the chain to Bitcoin is broken for those hours, and a late stamp can never restore their timeliness"
            exit 1
          fi
          echo "OK — every anchor older than 3h carries a stamp"
